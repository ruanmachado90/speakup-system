name: Deploy to Hostgator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: speakup-system/package-lock.json
      
      - name: 📦 Install dependencies
        run: |
          cd speakup-system
          npm ci
      
      - name: 🏗️ Build application
        run: |
          cd speakup-system
          npm run build
      
      - name: 🚀 Deploy to Hostgator via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ftp.speakupcataguases.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: speakup-system/dist/
          server-dir: /home2/speaku17/public_ftp/system/
          dangerous-clean-slate: false
